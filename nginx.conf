server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Force HTTPS — Railway terminates SSL at proxy, passes original protocol via header
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Serve APK binary directly — MUST come before the SPA catch-all
    # Without this, try_files falls back to index.html (135 bytes) when the file is missing
    location ~* \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        gzip off;
        try_files $uri =404;
    }

    # SPA routing — send all routes to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets forever (Vite adds content hashes to filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
